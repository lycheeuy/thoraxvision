services:
  backend:
    image: thoraxvision-backend:phase-11.3d
    container_name: thoraxvision-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    image: thoraxvision-frontend:phase-10
    container_name: thoraxvision-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped